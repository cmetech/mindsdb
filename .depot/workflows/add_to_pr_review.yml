# Depot CI Migration
# Source: .github/workflows/add_to_pr_review.yml
#
# Changes made:
# - Changed GitHub runs-on labels to their Depot equivalents

name: Add Pull Requests to PR review project

permissions:
  contents: read

# GitLab runners are the default; Depot execution is opt-in.
on:
  workflow_dispatch:

jobs:
  add-to-project:
    runs-on: depot-ubuntu-latest # was: ubuntu-latest. Mapped standard GitHub runner to Depot equivalent.

    steps:
    - name: Check if actor is an organization member
      id: check-membership
      run: |
        if [[ "${{ github.actor }}" == "mindsdb/"* ]]; then
          echo "::set-output name=isOrgMember::true"
        else
          echo "::set-output name=isOrgMember::false"
        fi
      shell: bash

    - name: Add issue to project
      if: steps.check-membership.outputs.isOrgMember == 'true'
      uses: actions/add-to-project@v0.5.0
      with:
        project-url: https://github.com/orgs/mindsdb/projects/65
        github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
